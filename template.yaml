AWSTemplateFormatVersion: 2010-09-09
Transform: AWS::Serverless-2016-10-31
Resources:
  ApiPassword:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}-api-password
      GenerateSecretString:
        PasswordLength: 32
        ExcludePunctuation: true
  TokenSigningKey:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub ${AWS::StackName}-token-signing-key
      GenerateSecretString:
        PasswordLength: 64
        ExcludePunctuation: true
  Table:
    Type: AWS::DynamoDB::Table
    Properties:
      AttributeDefinitions:
        - AttributeName: id
          AttributeType: S
        - AttributeName: library
          AttributeType: S
        - AttributeName: orderKey
          AttributeType: S
      BillingMode: PAY_PER_REQUEST
      KeySchema:
        - AttributeName: id
          KeyType: HASH
      GlobalSecondaryIndexes:
        - IndexName: RecordingsByCreatedAt
          KeySchema:
            - AttributeName: library
              KeyType: HASH
            - AttributeName: orderKey
              KeyType: RANGE
          Projection:
            ProjectionType: ALL
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      TableName: !Sub ${AWS::StackName}-Table
  FrontEnd:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-frontend
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
  FileStore:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: !Sub ${AWS::StackName}-filestore
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
  OriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Sub ${AWS::StackName}-s3
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4
  AudioResponseHeaders:
    Type: AWS::CloudFront::ResponseHeadersPolicy
    Properties:
      ResponseHeadersPolicyConfig:
        Name: !Sub ${AWS::StackName}-audio
        CustomHeadersConfig:
          Items:
            - Header: Cache-Control
              Value: no-store
              Override: true
  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Enabled: true
        DefaultRootObject: index.html
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
        Origins:
          - Id: frontend
            DomainName: !GetAtt FrontEnd.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ''
          - Id: audio
            DomainName: !GetAtt FileStore.RegionalDomainName
            OriginAccessControlId: !Ref OriginAccessControl
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: frontend
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
        CacheBehaviors:
          - PathPattern: '*.mp3'
            TargetOriginId: audio
            ViewerProtocolPolicy: redirect-to-https
            AllowedMethods: [GET, HEAD]
            CachedMethods: [GET, HEAD]
            CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad
            ResponseHeadersPolicyId: !Ref AudioResponseHeaders
  FrontEndPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FrontEnd
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FrontEnd.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}
  FileStorePolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref FileStore
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${FileStore.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${Distribution}
  CreateNewFile:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-CreateNewFile
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: CreateNewFile
      Architectures:
        - arm64
      CodeUri: src/CreateNewFile
      Handler: index.handler
      Runtime: nodejs24.x
      MemorySize: 256
      Timeout: 15
      Tracing: Active
      Policies:
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Resource: !Sub '${FileStore.Arn}/????????-????-4???-????-????????????.*.mp3'
              Action:
                - s3:PutObject
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Resource: !GetAtt Table.Arn
              Action:
                - dynamodb:UpdateItem
                - dynamodb:PutItem
                - dynamodb:GetItem
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Resource: '*'
              Action:
                - polly:StartSpeechSynthesisTask
        - AWSXrayWriteOnlyAccess
      Environment:
        Variables:
          AUDIO_BASE_URL: !Sub https://${Distribution.DomainName}
          TABLE_NAME: !Ref Table
          TABLE_ARN: !GetAtt Table.Arn
          BUCKET_NAME: !Ref FileStore
          BUCKET_ARN: !GetAtt FileStore.Arn
      Events:
        HttpApiPOSTfile:
          Type: HttpApi
          Properties:
            Path: /file
            Method: POST
            ApiId: !Ref HttpApi
            PayloadFormatVersion: '2.0'
            TimeoutInMillis: 29000
  DeleteFile:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-DeleteFile
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: DeleteFile
      Architectures:
        - arm64
      CodeUri: src/DeleteFile
      Handler: index.handler
      Runtime: nodejs24.x
      MemorySize: 3008
      Timeout: 45
      Tracing: Active
      Policies:
        - AWSXrayWriteOnlyAccess
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Resource: !GetAtt Table.Arn
              Action:
                - dynamodb:GetItem
                - dynamodb:DeleteItem
                - dynamodb:UpdateItem
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Resource: !Sub '${FileStore.Arn}/????????-????-4???-????-????????????.*.mp3'
              Action:
                - s3:DeleteObject
            - Effect: Allow
              Resource: !GetAtt FileStore.Arn
              Action: s3:ListBucket
              Condition:
                StringLike:
                  s3:prefix: '????????-????-4???-????-????????????.*'
      Environment:
        Variables:
          BUCKET_NAME: !Ref FileStore
          BUCKET_ARN: !GetAtt FileStore.Arn
          TABLE_NAME: !Ref Table
          TABLE_ARN: !GetAtt Table.Arn
      Events:
        HttpApiDELETEfileid:
          Type: HttpApi
          Properties:
            Path: /file/{id}
            Method: DELETE
            ApiId: !Ref HttpApi
            PayloadFormatVersion: '2.0'
            TimeoutInMillis: 29000
  GetVoices:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-GetVoices
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: GetVoices
      Architectures:
        - arm64
      CodeUri: src/GetVoices
      Handler: index.handler
      Runtime: nodejs24.x
      MemorySize: 3008
      Timeout: 60
      Tracing: Active
      Policies:
        - AWSXrayWriteOnlyAccess
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Resource: '*'
              Action:
                - polly:DescribeVoices
      Events:
        HttpApiGETvoices:
          Type: HttpApi
          Properties:
            Path: /voices
            Method: GET
            ApiId: !Ref HttpApi
            PayloadFormatVersion: '2.0'
            TimeoutInMillis: 29000
  ListFiles:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-ListFiles
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: ListFiles
      Architectures:
        - arm64
      CodeUri: src/ListFiles
      Handler: index.handler
      Runtime: nodejs24.x
      MemorySize: 3008
      Timeout: 30
      Tracing: Active
      Policies:
        - AWSXrayWriteOnlyAccess
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Resource: !GetAtt Table.Arn
              Action:
                - dynamodb:GetItem
                - dynamodb:UpdateItem
            - Effect: Allow
              Resource: !Sub '${Table.Arn}/index/RecordingsByCreatedAt'
              Action: dynamodb:Query
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Resource: '*'
              Action: polly:GetSpeechSynthesisTask
            - Effect: Allow
              Resource: !GetAtt FileStore.Arn
              Action: s3:ListBucket
              Condition:
                StringLike:
                  s3:prefix: '????????-????-4???-????-????????????.*'
      Environment:
        Variables:
          AUDIO_BASE_URL: !Sub https://${Distribution.DomainName}
          TABLE_NAME: !Ref Table
          TABLE_ARN: !GetAtt Table.Arn
          BUCKET_NAME: !Ref FileStore
      Events:
        HttpApiGETfile:
          Type: HttpApi
          Properties:
            Path: /file
            Method: GET
            ApiId: !Ref HttpApi
            PayloadFormatVersion: '2.0'
            TimeoutInMillis: 29000
        HttpApiGETfileid:
          Type: HttpApi
          Properties:
            Path: /file/{id}
            Method: GET
            ApiId: !Ref HttpApi
            PayloadFormatVersion: '2.0'
            TimeoutInMillis: 29000
  Website:
    Type: AWS::CodeBuild::Project
    Properties:
      Name: !Sub ${AWS::StackName}-Website
      Artifacts:
        Type: NO_ARTIFACTS
      Environment:
        ComputeType: BUILD_GENERAL1_SMALL
        Image: aws/codebuild/standard:8.0
        Type: LINUX_CONTAINER
        EnvironmentVariables:
          - Name: API_URL
            Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
      ServiceRole: !GetAtt WebsiteRole.Arn
      Source:
        Type: NO_SOURCE
        BuildSpec: !Sub
          - |-
            version: 0.2
            phases:
              install:
                runtime-versions:
                  nodejs: 24
                commands:
                  - git clone ${SourceLocation} repo
                  - cd repo
                  - git checkout ${SourceVersion}
                  - cd ${SourceDirectory}
              pre_build:
                commands:
                  - npm ci --include=dev
              build:
                commands:
                  - ${BuildCommand}
              post_build:
                commands:
                  - if [ "$CODEBUILD_BUILD_SUCCEEDING" = 0 ]; then exit 1; fi
                  - cd "${!CODEBUILD_SRC_DIR}/repo"
                  - aws s3 sync '${PublishDirectory}' 's3://${DestinationBucketName}' --cache-control 'max-age=0, must-revalidate, public' --no-progress --delete
          - PublishDirectory: src/frontend/build
            BuildCommand: npm run production
            SourceDirectory: src/frontend
            DestinationBucketName: !Ref FrontEnd
      Tags:
        - Key: StackName
          Value: !Sub ${AWS::StackName}
  WebsiteEvents:
    Type: AWS::Events::Rule
    Properties:
      EventPattern:
        source:
          - aws.codebuild
        detail-type:
          - CodeBuild Build State Change
        detail:
          build-status:
            - SUCCEEDED
            - FAILED
            - FAULT
            - STOPPED
            - TIMED_OUT
          project-name:
            - !Ref Website
      Targets:
        - Arn: !GetAtt WebsiteBuildTrigger.Arn
          Id: WebsiteBuildTrigger
  WebsiteEventsPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt WebsiteBuildTrigger.Arn
      Principal: events.amazonaws.com
      SourceArn: !GetAtt WebsiteEvents.Arn
  WebsiteRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub ${AWS::StackName}-Website
      AssumeRolePolicyDocument:
        Version: 2012-10-17
        Statement:
          Effect: Allow
          Principal:
            Service: codebuild.amazonaws.com
          Action: sts:AssumeRole
      Policies:
        - PolicyName: Logs
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${AWS::StackName}-Website:log-stream:*
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                Resource:
                  - !Sub arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/codebuild/${AWS::StackName}-Website
        - PolicyName: UploadToDestinationObjectStore
          PolicyDocument:
            Version: 2012-10-17
            Statement:
              - Effect: Allow
                Action:
                  - s3:DeleteObject
                  - s3:GetBucketLocation
                  - s3:GetObject
                  - s3:ListBucket
                  - s3:PutObject
                Resource:
                  - !Sub ${FrontEnd.Arn}/*
                  - !Sub ${FrontEnd.Arn}
  Login:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-Login
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: Login
      Architectures:
        - arm64
      CodeUri: src/Auth
      Handler: login.handler
      Runtime: nodejs24.x
      MemorySize: 256
      Timeout: 5
      Tracing: Active
      Policies:
        - AWSXrayWriteOnlyAccess
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource:
                - !Ref ApiPassword
                - !Ref TokenSigningKey
      Environment:
        Variables:
          PASSWORD_SECRET_ARN: !Ref ApiPassword
          SIGNING_KEY_SECRET_ARN: !Ref TokenSigningKey
          TOKEN_TTL_HOURS: !Ref TokenTtlHours
      Events:
        HttpApiPOSTlogin:
          Type: HttpApi
          Properties:
            Path: /login
            Method: POST
            ApiId: !Ref HttpApi
            PayloadFormatVersion: '2.0'
            Auth:
              Authorizer: NONE
  TokenAuthorizer:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-TokenAuthorizer
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: TokenAuthorizer
      Architectures:
        - arm64
      CodeUri: src/Auth
      Handler: authorizer.handler
      Runtime: nodejs24.x
      MemorySize: 256
      Timeout: 5
      Tracing: Active
      Policies:
        - AWSXrayWriteOnlyAccess
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Action: secretsmanager:GetSecretValue
              Resource: !Ref TokenSigningKey
      Environment:
        Variables:
          SIGNING_KEY_SECRET_ARN: !Ref TokenSigningKey
  TokenAuthorizerInvokePermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !GetAtt TokenAuthorizer.Arn
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/authorizers/*
  HttpApi:
    Type: AWS::Serverless::HttpApi
    Properties:
      DefinitionBody:
        openapi: '3.0'
        info:
          title: !Sub ${AWS::StackName}-HttpApi
          version: '1.0'
        paths:
          /voices:
            get:
              responses: {}
          /file:
            get:
              responses: {}
            post:
              responses: {}
          /file/{id}:
            get:
              responses: {}
            delete:
              responses: {}
          /login:
            post:
              responses: {}
      FailOnWarnings: true
      CorsConfiguration:
        AllowOrigins:
          - !Sub https://${Distribution.DomainName}
          - http://localhost:3000
        AllowMethods:
          - '*'
        AllowHeaders:
          - Authorization
          - Content-Type
      Auth:
        DefaultAuthorizer: TokenAuthorizer
        Authorizers:
          TokenAuthorizer:
            FunctionArn: !GetAtt TokenAuthorizer.Arn
            AuthorizerPayloadFormatVersion: '2.0'
            EnableSimpleResponses: true
            Identity:
              Headers:
                - Authorization
              ReauthorizeEvery: 300
      DefaultRouteSettings:
        ThrottlingRateLimit: 5
        ThrottlingBurstLimit: 10
  WebsiteBuildTrigger:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: !Sub ${AWS::StackName}-WebsiteBuildTrigger
      Description: !Sub
        - Stack ${AWS::StackName} Function ${ResourceName}
        - ResourceName: WebsiteBuildTrigger
      Architectures:
        - arm64
      CodeUri: src/WebsiteBuildTrigger
      Handler: index.handler
      Runtime: nodejs24.x
      MemorySize: 5000
      Timeout: 30
      Tracing: Active
      Policies:
        - AWSXrayWriteOnlyAccess
        - Version: 2012-10-17
          Statement:
            - Effect: Allow
              Resource: !GetAtt Website.Arn
              Action:
                - codebuild:StartBuild
  WebsiteBuildTriggerDeployTrigger:
    Type: Custom::FunctionDeployTrigger
    DependsOn: WebsiteEvents
    Properties:
      ServiceToken: !GetAtt WebsiteBuildTrigger.Arn
      Type: website
      ProjectName: !Ref Website
      SourceVersion: !Ref SourceVersion
Parameters:
  SourceLocation:
    Type: String
    Description: Location of source code for deployment (designed to work with
      public Github repos)
    Default: https://github.com/deeheber/text-to-speech-converter.git
  SourceVersion:
    Type: String
    Description: Source version for deployment (i.e. Git SHA)
  TokenTtlHours:
    Type: Number
    Description: Lifetime of a login token in hours
    Default: 168
    MinValue: 1
Outputs:
  ApiPasswordSecretArn:
    Description: ARN of the secret holding the site password
    Value: !Ref ApiPassword
  TokenSigningKeySecretArn:
    Description: ARN of the secret holding the token signing key
    Value: !Ref TokenSigningKey
  ApiURL:
    Description: The URL for the API
    Value: !Sub https://${HttpApi}.execute-api.${AWS::Region}.amazonaws.com
  FrontendURL:
    Description: The HTTPS frontend URL
    Value: !Sub https://${Distribution.DomainName}
  AudioBaseURL:
    Description: The HTTPS base URL for recordings
    Value: !Sub https://${Distribution.DomainName}
